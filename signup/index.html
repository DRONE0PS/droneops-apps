<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DroneOps — Sign Up</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#020817;color:white;font-family:'Inter',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;position:relative;overflow:hidden}
.glow1{position:absolute;top:20%;left:50%;transform:translateX(-50%);width:400px;height:400px;background:radial-gradient(circle,rgba(14,165,233,0.12) 0%,transparent 70%);pointer-events:none}
.grid-bg{position:absolute;inset:0;background-image:linear-gradient(rgba(14,165,233,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(14,165,233,0.03) 1px,transparent 1px);background-size:50px 50px;pointer-events:none}
.logo-wrap{display:flex;align-items:center;gap:10px;margin-bottom:32px}
.logo-icon{width:40px;height:40px;background:linear-gradient(135deg,#0ea5e9,#06b6d4);border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:'Orbitron',sans-serif;font-weight:900;font-size:18px;color:white;box-shadow:0 0 20px rgba(14,165,233,0.4)}
.logo-text{font-family:'Orbitron',sans-serif;font-weight:700;font-size:18px;letter-spacing:2px}
.card{background:rgba(15,23,42,0.8);border:1px solid rgba(14,165,233,0.15);border-radius:24px;padding:28px 24px;width:100%;max-width:380px;backdrop-filter:blur(20px)}
.card-title{font-family:'Orbitron',sans-serif;font-size:18px;font-weight:900;letter-spacing:1px;margin-bottom:6px;text-align:center}
.card-sub{color:#334155;font-size:13px;text-align:center;margin-bottom:28px}
.label{color:#94a3b8;font-size:12px;font-weight:500;letter-spacing:0.5px;margin-bottom:8px;display:block}
.input{width:100%;background:rgba(2,8,23,0.8);border:1px solid rgba(14,165,233,0.15);border-radius:12px;padding:14px 16px;color:white;font-size:14px;font-family:'Inter',sans-serif;margin-bottom:16px;outline:none}
.input:focus{border-color:rgba(14,165,233,0.4)}
.input::placeholder{color:#334155}
.select{width:100%;background:rgba(2,8,23,0.8);border:1px solid rgba(14,165,233,0.15);border-radius:12px;padding:14px 16px;color:#94a3b8;font-size:14px;font-family:'Inter',sans-serif;margin-bottom:16px;outline:none}
.plan-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:20px}
.plan-option{background:rgba(2,8,23,0.8);border:1px solid rgba(14,165,233,0.15);border-radius:10px;padding:12px 8px;text-align:center;cursor:pointer}
.plan-option.selected{border-color:#0ea5e9;background:rgba(14,165,233,0.1)}
.plan-name{font-family:'Orbitron',sans-serif;font-size:10px;font-weight:700;letter-spacing:1px;color:#0ea5e9;margin-bottom:4px}
.plan-price{color:#94a3b8;font-size:11px}
.btn{width:100%;background:linear-gradient(135deg,#0ea5e9,#06b6d4);color:white;padding:16px;border-radius:12px;font-family:'Orbitron',sans-serif;font-size:13px;font-weight:700;letter-spacing:1px;border:none;cursor:pointer;box-shadow:0 0 25px rgba(14,165,233,0.3);margin-bottom:20px;text-align:center;display:block;text-decoration:none}
.terms{color:#334155;font-size:11px;text-align:center;margin-bottom:20px;line-height:1.6}
.terms a{color:#0ea5e9;text-decoration:none}
.login-text{text-align:center;color:#334155;font-size:13px}
.login-link{color:#0ea5e9;text-decoration:none;font-weight:600}
.home-link{color:#334155;font-size:12px;text-decoration:none;margin-top:24px;display:block;text-align:center}
</style>
</head>
<body>
<div class="glow1"></div>
<div class="grid-bg"></div>

<div class="logo-wrap">
  <div class="logo-icon">D</div>
  <span class="logo-text">DRONEOPS</span>
</div>

<div class="card">
  <div class="card-title">CREATE ACCOUNT</div>
  <div class="card-sub">Start managing your drone fleet today</div>

  <label class="label">FULL NAME</label>
  <input class="input" type="text" placeholder="John Martinez">

  <label class="label">COMPANY NAME</label>
  <input class="input" type="text" placeholder="DroneOps Inc.">

  <label class="label">EMAIL ADDRESS</label>
  <input class="input" type="email" placeholder="operator@company.com">

  <label class="label">PASSWORD</label>
  <input class="input" type="password" placeholder="••••••••">

  <label class="label">CONFIRM PASSWORD</label>
  <input class="input" type="password" placeholder="••••••••">

  <label class="label">SELECT PLAN</label>
  <div class="plan-grid">
    <div class="plan-option selected">
      <div class="plan-name">FREE</div>
      <div class="plan-price">$0/mo</div>
    </div>
    <div class="plan-option">
      <div class="plan-name">PRO</div>
      <div class="plan-price">$21/mo</div>
    </div>
    <div class="plan-option">
      <div class="plan-name">ENT.</div>
      <div class="plan-price">$55/mo</div>
    </div>
  </div>

  <a href="/droneops-apps/dashboard/" class="btn">CREATE ACCOUNT</a>

  <div class="terms">
    By creating an account you agree to our
    <a href="#">Terms of Service</a> and
    <a href="#">Privacy Policy</a>
  </div>

  <div class="login-text">
    Already have an account?
    <a href="/droneops-apps/login/" class="login-link">Sign in</a>
  </div>
</div>

<a href="/droneops-apps/" class="home-link">← Back to Home</a>

</body>
</html>
