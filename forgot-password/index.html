<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DroneOps — Forgot Password</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#020817;color:white;font-family:'Inter',sans-serif;min-height:100vh;padding:20px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.logo-wrap{display:flex;align-items:center;gap:10px;margin-bottom:24px}
.logo-icon{width:36px;height:36px;background:linear-gradient(135deg,#0ea5e9,#06b6d4);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;color:white}
.logo-text{font-family:'Orbitron',sans-serif;font-weight:700;font-size:16px;letter-spacing:2px}
.card{background:rgba(15,23,42,0.9);border:1px solid rgba(14,165,233,0.15);border-radius:20px;padding:24px 20px;width:100%;max-width:360px}
.icon{width:64px;height:64px;background:rgba(14,165,233,0.1);border:1px solid rgba(14,165,233,0.2);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;font-size:28px}
.title{font-family:'Orbitron',sans-serif;font-size:16px;font-weight:900;letter-spacing:1px;margin-bottom:8px;text-align:center}
.sub{color:#334155;font-size:12px;text-align:center;margin-bottom:24px;line-height:1.6}
.label{color:#94a3b8;font-size:11px;letter-spacing:0.5px;margin-bottom:6px;display:block}
.input{width:100%;background:rgba(2,8,23,0.8);border:1px solid rgba(14,165,233,0.15);border-radius:10px;padding:12px 14px;color:white;font-size:14px;margin-bottom:20px;outline:none;box-sizing:border-box;font-family:'Inter',sans-serif}
.input::placeholder{color:#334155}
.btn{width:100%;background:linear-gradient(135deg,#0ea5e9,#06b6d4);color:white;padding:14px;border-radius:10px;font-family:'Orbitron',sans-serif;font-size:12px;font-weight:700;letter-spacing:1px;border:none;cursor:pointer;margin-bottom:16px}
.msg{border-radius:8px;padding:10px;margin-bottom:14px;font-size:12px;text-align:center;display:none}
.error{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.2);color:#f87171}
.success{background:rgba(34,197,94,0.1);border:1px solid rgba(34,197,94,0.2);color:#4ade80}
.back-link{text-align:center;color:#334155;font-size:12px}
.back-a{color:#0ea5e9;text-decoration:none;font-weight:600}
.home-link{color:#334155;font-size:12px;text-decoration:none;margin-top:16px;display:block;text-align:center}
</style>
</head>
<body>
<div class="logo-wrap">
  <div class="logo-icon">D</div>
  <span class="logo-text">DRONEOPS</span>
</div>
<div class="card">
  <div class="icon">🔐</div>
  <div class="title">RESET PASSWORD</div>
  <div class="sub">Enter your email and we'll send you a link to reset your password</div>
  <div class="msg error" id="error"></div>
  <div class="msg success" id="success"></div>
  <div id="formSection">
    <label class="label">EMAIL ADDRESS</label>
    <input class="input" type="email" id="email" placeholder="operator@droneops.io">
    <button class="btn" id="resetBtn" onclick="handleReset()">SEND RESET LINK</button>
  </div>
  <div class="back-link">
    Remember your password?
    <a href="/login" class="back-a">Sign in</a>
  </div>
</div>
<a href="/" class="home-link">← Back to Home</a>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'
const supabase = createClient(
  'https://hgmtppatmmxzpyeooyux.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhnbXRwcGF0bW14enB5ZW9veXV4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0Mjk2OTcsImV4cCI6MjA5NjAwNTY5N30.IsVw4QCXCZP_uT_qnbJ4xM0l2xypmGdNUJxUjato1vQ'
)
function showMsg(type, msg) {
  document.getElementById('error').style.display = 'none'
  document.getElementById('success').style.display = 'none'
  var el = document.getElementById(type)
  el.textContent = msg
  el.style.display = 'block'
}
window.handleReset = async function() {
  var email = document.getElementById('email').value.trim()
  var btn = document.getElementById('resetBtn')
  if (!email) {
    showMsg('error', 'Please enter your email address')
    return
  }
  btn.textContent = 'SENDING...'
  btn.disabled = true
  try {
    const { error } = await supabase.auth.resetPasswordForEmail(email, {
      redirectTo: 'https://droneops-app.vercel.app/reset-password'
    })
    if (error) {
      showMsg('error', error.message)
      btn.textContent = 'SEND RESET LINK'
      btn.disabled = false
      return
    }
    document.getElementById('formSection').style.display = 'none'
    showMsg('success', '📧 Reset link sent! Check your email inbox.')
  } catch(err) {
    showMsg('error', 'Error: ' + err.message)
    btn.textContent = 'SEND RESET LINK'
    btn.disabled = false
  }
}
</script>
</body>
</html>
