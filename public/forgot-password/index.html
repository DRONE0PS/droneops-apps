<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DroneOps — Forgot Password</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#020817;color:white;font-family:'Inter',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;position:relative;overflow:hidden}
.glow1{position:absolute;top:20%;left:50%;transform:translateX(-50%);width:400px;height:400px;background:radial-gradient(circle,rgba(14,165,233,0.12) 0%,transparent 70%);pointer-events:none}
.grid-bg{position:absolute;inset:0;background-image:linear-gradient(rgba(14,165,233,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(14,165,233,0.03) 1px,transparent 1px);background-size:50px 50px;pointer-events:none}
.logo-wrap{display:flex;align-items:center;gap:10px;margin-bottom:32px}
.logo-icon{width:40px;height:40px;background:linear-gradient(135deg,#0ea5e9,#06b6d4);border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:'Orbitron',sans-serif;font-weight:900;font-size:18px;color:white;box-shadow:0 0 20px rgba(14,165,233,0.4)}
.logo-text{font-family:'Orbitron',sans-serif;font-weight:700;font-size:18px;letter-spacing:2px}
.card{background:rgba(15,23,42,0.8);border:1px solid rgba(14,165,233,0.15);border-radius:24px;padding:28px 24px;width:100%;max-width:380px;backdrop-filter:blur(20px)}
.icon-wrap{width:64px;height:64px;background:rgba(14,165,233,0.1);border:1px solid rgba(14,165,233,0.2);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;font-size:28px}
.card-title{font-family:'Orbitron',sans-serif;font-size:18px;font-weight:900;letter-spacing:1px;margin-bottom:8px;text-align:center}
.card-sub{color:#334155;font-size:13px;text-align:center;margin-bottom:28px;line-height:1.6}
.label{color:#94a3b8;font-size:12px;font-weight:500;letter-spacing:0.5px;margin-bottom:8px;display:block}
.input{width:100%;background:rgba(2,8,23,0.8);border:1px solid rgba(14,165,233,0.15);border-radius:12px;padding:14px 16px;color:white;font-size:14px;font-family:'Inter',sans-serif;margin-bottom:24px;outline:none}
.input::placeholder{color:#334155}
.btn{width:100%;background:linear-gradient(135deg,#0ea5e9,#06b6d4);color:white;padding:16px;border-radius:12px;font-family:'Orbitron',sans-serif;font-size:13px;font-weight:700;letter-spacing:1px;border:none;cursor:pointer;box-shadow:0 0 25px rgba(14,165,233,0.3);margin-bottom:20px;text-align:center;display:block;text-decoration:none}
.back-login{text-align:center;color:#334155;font-size:13px}
.back-link{color:#0ea5e9;text-decoration:none;font-weight:600}
.home-link{color:#334155;font-size:12px;text-decoration:none;margin-top:24px;display:block;text-align:center}
.steps{margin-bottom:24px}
.step{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.step-num{width:24px;height:24px;background:rgba(14,165,233,0.1);border:1px solid rgba(14,165,233,0.3);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#0ea5e9;font-size:11px;font-weight:700;flex-shrink:0}
.step-text{color:#334155;font-size:12px;line-height:1.5}
</style>
</head>
<body>
<div class="glow1"></div>
<div class="grid-bg"></div>

<div class="logo-wrap">
  <div class="logo-icon">D</div>
  <span class="logo-text">DRONEOPS</span>
</div>

<div class="card">
  <div class="icon-wrap">🔐</div>
  <div class="card-title">RESET PASSWORD</div>
  <div class="card-sub">Enter your email address and we'll send you a link to reset your password</div>

  <div class="steps">
    <div class="step">
      <div class="step-num">1</div>
      <div class="step-text">Enter your registered email address</div>
    </div>
    <div class="step">
      <div class="step-num">2</div>
      <div class="step-text">Check your inbox for reset link</div>
    </div>
    <div class="step">
      <div class="step-num">3</div>
      <div class="step-text">Create your new password</div>
    </div>
  </div>

  <label class="label">EMAIL ADDRESS</label>
  <input class="input" type="email" placeholder="operator@droneops.io">

  <a href="/login/" class="btn">SEND RESET LINK</a>

  <div class="back-login">
    Remember your password?
    <a href="/login/" class="back-link">Sign in</a>
  </div>
</div>

<a href="/" class="home-link">← Back to Home</a>

</body>
</html>
