<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DroneOps — Sign Up</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#020817;color:white;font-family:'Inter',sans-serif;min-height:100vh;padding:20px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.logo-wrap{display:flex;align-items:center;gap:10px;margin-bottom:24px}
.logo-icon{width:36px;height:36px;background:linear-gradient(135deg,#0ea5e9,#06b6d4);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;color:white}
.logo-text{font-family:'Orbitron',sans-serif;font-weight:700;font-size:16px;letter-spacing:2px}
.card{background:rgba(15,23,42,0.9);border:1px solid rgba(14,165,233,0.15);border-radius:20px;padding:24px 20px;width:100%;max-width:360px}
.title{font-family:'Orbitron',sans-serif;font-size:16px;font-weight:900;letter-spacing:1px;margin-bottom:4px;text-align:center}
.sub{color:#334155;font-size:12px;text-align:center;margin-bottom:20px}
.label{color:#94a3b8;font-size:11px;letter-spacing:0.5px;margin-bottom:6px;display:block}
.input{width:100%;background:rgba(2,8,23,0.8);border:1px solid rgba(14,165,233,0.15);border-radius:10px;padding:12px 14px;color:white;font-size:14px;margin-bottom:12px;outline:none;box-sizing:border-box;font-family:'Inter',sans-serif}
.input::placeholder{color:#334155}
.plan-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px}
.plan-opt{background:rgba(2,8,23,0.8);border:2px solid rgba(14,165,233,0.1);border-radius:10px;padding:10px 6px;text-align:center;cursor:pointer}
.plan-opt.active{border-color:#0ea5e9;background:rgba(14,165,233,0.15)}
.plan-name{font-family:'Orbitron',sans-serif;font-size:10px;font-weight:700;color:#0ea5e9;margin-bottom:3px}
.plan-price{color:#94a3b8;font-size:11px}
.btn{width:100%;background:linear-gradient(135deg,#0ea5e9,#06b6d4);color:white;padding:14px;border-radius:10px;font-family:'Orbitron',sans-serif;font-size:12px;font-weight:700;letter-spacing:1px;border:none;cursor:pointer;margin-bottom:14px}
.msg{border-radius:8px;padding:10px;margin-bottom:14px;font-size:12px;text-align:center;display:none}
.error{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.2);color:#f87171}
.success{background:rgba(34,197,94,0.1);border:1px solid rgba(34,197,94,0.2);color:#4ade80}
.login-text{text-align:center;color:#334155;font-size:12px}
.login-link{color:#0ea5e9;text-decoration:none;font-weight:600}
.home-link{color:#334155;font-size:12px;text-decoration:none;margin-top:16px;display:block;text-align:center}
</style>
</head>
<body>
<div class="logo-wrap">
  <div class="logo-icon">D</div>
  <span class="logo-text">DRONEOPS</span>
</div>
<div class="card">
  <div class="title">CREATE ACCOUNT</div>
  <div class="sub">Start managing your drone fleet today</div>
  <div class="msg error" id="error"></div>
  <div class="msg success" id="success"></div>
  <label class="label">FULL NAME</label>
  <input class="input" type="text" id="fullName" placeholder="John Martinez">
  <label class="label">COMPANY NAME</label>
  <input class="input" type="text" id="company" placeholder="DroneOps Inc.">
  <label class="label">EMAIL ADDRESS</label>
  <input class="input" type="email" id="email" placeholder="operator@company.com">
  <label class="label">PASSWORD</label>
  <input class="input" type="password" id="password" placeholder="••••••••">
  <label class="label">SELECT PLAN</label>
  <div class="plan-grid">
    <div class="plan-opt active" onclick="selectPlan('free',this)">
      <div class="plan-name">FREE</div>
      <div class="plan-price">$0/mo</div>
    </div>
    <div class="plan-opt" onclick="selectPlan('pro',this)">
      <div class="plan-name">PRO</div>
      <div class="plan-price">$21/mo</div>
    </div>
    <div class="plan-opt" onclick="selectPlan('enterprise',this)">
      <div class="plan-name">ENT.</div>
      <div class="plan-price">$55/mo</div>
    </div>
  </div>
  <button class="btn" id="signupBtn" onclick="handleSignup()">CREATE ACCOUNT</button>
  <div class="login-text">
    Already have an account?
    <a href="/login" class="login-link">Sign in</a>
  </div>
</div>
<a href="/" class="home-link">← Back to Home</a>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'
const supabase = createClient(
  'https://hgmtppatmmxzpyeooyux.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhnbXRwcGF0bW14enB5ZW9veXV4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0Mjk2OTcsImV4cCI6MjA5NjAwNTY5N30.IsVw4QCXCZP_uT_qnbJ4xM0l2xypmGdNUJxUjato1vQ'
)
var selectedPlan = 'free'
window.selectPlan = function(plan, el) {
  selectedPlan = plan
  document.querySelectorAll('.plan-opt').forEach(p => p.classList.remove('active'))
  el.classList.add('active')
}
function showMsg(type, msg) {
  document.getElementById('error').style.display = 'none'
  document.getElementById('success').style.display = 'none'
  var el = document.getElementById(type)
  el.textContent = msg
  el.style.display = 'block'
}
window.handleSignup = async function() {
  var fullName = document.getElementById('fullName').value.trim()
  var company = document.getElementById('company').value.trim()
  var email = document.getElementById('email').value.trim()
  var password = document.getElementById('password').value
  var btn = document.getElementById('signupBtn')
  if (!fullName || !email || !password) {
    showMsg('error', 'Please fill in all required fields')
    return
  }
  if (password.length < 6) {
    showMsg('error', 'Password must be at least 6 characters')
    return
  }
  btn.textContent = 'CREATING ACCOUNT...'
  btn.disabled = true
  showMsg('success', 'Connecting to server...')
  try {
    const { data, error } = await supabase.auth.signUp({
      email: email,
      password: password,
      options: {
        data: {
          full_name: fullName,
          company_name: company,
          plan: selectedPlan
        }
      }
    })
    if (error) {
      showMsg('error', error.message)
      btn.textContent = 'CREATE ACCOUNT'
      btn.disabled = false
      return
    }
    if (data && data.user) {
      showMsg('success', 'Account created! Sending welcome email...')
      await supabase.from('profiles').insert({
        id: data.user.id,
        full_name: fullName,
        company_name: company,
        plan: selectedPlan,
        role: 'admin'
      })
      await fetch('https://api.resend.com/emails', {
        method: 'POST',
        headers: {
          'Authorization': 'Bearer re_5qqPt5Dh_L4ejmYY5RHAorQ11oaypAg9U',
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          from: 'DroneOps <onboarding@resend.dev>',
          to: email,
          subject: 'Welcome to DroneOps! 🛸',
          html: '<div style="background:#020817;padding:40px;font-family:Arial,sans-serif"><h1 style="color:#0ea5e9">Welcome to DroneOps! 🛸</h1><p style="color:#94a3b8;margin:16px 0">Hi ' + fullName + ', your account is ready!</p><p style="color:#94a3b8;margin-bottom:24px">Start managing your drone fleet today.</p><a href="https://droneops-app.vercel.app/login" style="background:#0ea5e9;color:white;padding:14px 28px;border-radius:8px;text-decoration:none;font-weight:bold">LAUNCH DRONEOPS</a><p style="color:#334155;margin-top:32px;font-size:12px">© 2025 DroneOps</p></div>'
        })
      })
      showMsg('success', 'Account created! Check your email for welcome message!')
      setTimeout(() => { window.location.href = '/dashboard' }, 3000)
    }
  } catch(err) {
    showMsg('error', 'Error: ' + err.message)
    btn.textContent = 'CREATE ACCOUNT'
    btn.disabled = false
  }
}
</script>
</body>
</html>
