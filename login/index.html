<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DroneOps — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#020817;color:white;font-family:'Inter',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;position:relative;overflow:hidden}
.glow{position:absolute;top:30%;left:50%;transform:translateX(-50%);width:300px;height:300px;background:radial-gradient(circle,rgba(14,165,233,0.12) 0%,transparent 70%);pointer-events:none}
.grid-bg{position:absolute;inset:0;background-image:linear-gradient(rgba(14,165,233,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(14,165,233,0.03) 1px,transparent 1px);background-size:50px 50px;pointer-events:none}
.logo-wrap{display:flex;align-items:center;gap:10px;margin-bottom:24px;position:relative;z-index:1}
.logo-icon{width:36px;height:36px;background:linear-gradient(135deg,#0ea5e9,#06b6d4);border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:'Orbitron',sans-serif;font-weight:900;font-size:16px;color:white}
.logo-text{font-family:'Orbitron',sans-serif;font-weight:700;font-size:16px;letter-spacing:2px}
.card{background:rgba(15,23,42,0.9);border:1px solid rgba(14,165,233,0.15);border-radius:20px;padding:24px 20px;width:100%;max-width:360px;position:relative;z-index:1}
.card-title{font-family:'Orbitron',sans-serif;font-size:16px;font-weight:900;letter-spacing:1px;margin-bottom:4px;text-align:center}
.card-sub{color:#334155;font-size:12px;text-align:center;margin-bottom:24px}
.label{color:#94a3b8;font-size:11px;font-weight:500;letter-spacing:0.5px;margin-bottom:6px;display:block}
.input{width:100%;background:rgba(2,8,23,0.8);border:1px solid rgba(14,165,233,0.15);border-radius:10px;padding:12px 14px;color:white;font-size:14px;font-family:'Inter',sans-serif;margin-bottom:14px;outline:none;-webkit-appearance:none}
.input::placeholder{color:#334155}
.row{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.remember{display:flex;align-items:center;gap:6px}
.remember-text{color:#94a3b8;font-size:12px}
.forgot{color:#0ea5e9;font-size:12px;text-decoration:none;display:inline-block;padding:4px 0}
.btn{width:100%;background:linear-gradient(135deg,#0ea5e9,#06b6d4);color:white;padding:14px;border-radius:10px;font-family:'Orbitron',sans-serif;font-size:12px;font-weight:700;letter-spacing:1px;border:none;cursor:pointer;box-shadow:0 0 20px rgba(14,165,233,0.3);margin-bottom:16px;text-align:center;display:block;text-decoration:none}
.divider{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.divider-line{flex:1;height:1px;background:rgba(14,165,233,0.08)}
.divider-text{color:#334155;font-size:11px}
.signup-text{text-align:center;color:#334155;font-size:12px}
.signup-link{color:#0ea5e9;text-decoration:none;font-weight:600}
.home-link{color:#334155;font-size:12px;text-decoration:none;margin-top:20px;display:block;text-align:center;position:relative;z-index:1}
</style>
</head>
<body>
<div class="glow"></div>
<div class="grid-bg"></div>
<div class="logo-wrap">
  <div class="logo-icon">D</div>
  <span class="logo-text">DRONEOPS</span>
</div>
<div class="card">
  <div class="card-title">WELCOME BACK</div>
  <div class="card-sub">Sign in to your DroneOps account</div>
  <label class="label">EMAIL ADDRESS</label>
  <input class="input" type="email" placeholder="operator@droneops.io">
  <label class="label">PASSWORD</label>
  <input class="input" type="password" placeholder="••••••••">
  <div class="row">
    <div class="remember">
      <input type="checkbox" style="accent-color:#0ea5e9">
      <span class="remember-text">Remember me</span>
    </div>
    <a href="/droneops-apps/forgot-password/" class="forgot">Forgot password?</a>
  </div>
  <a href="/droneops-apps/dashboard/" class="btn">SIGN IN</a>
  <div class="divider">
    <div class="divider-line"></div>
    <span class="divider-text">OR</span>
    <div class="divider-line"></div>
  </div>
  <div class="signup-text">
    Don't have an account?
    <a href="/droneops-apps/signup/" class="signup-link">Create account</a>
  </div>
</div>
<a href="/droneops-apps/" class="home-link">← Back to Home</a>
</body>
</html>
