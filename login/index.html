<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DroneOps — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#020817;color:white;font-family:'Inter',sans-serif;min-height:100vh;padding:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden}
.glow{position:fixed;top:30%;left:50%;transform:translateX(-50%);width:300px;height:300px;background:radial-gradient(circle,rgba(14,165,233,0.12) 0%,transparent 70%);pointer-events:none}
.logo-wrap{display:flex;align-items:center;gap:10px;margin-bottom:24px;position:relative;z-index:1}
.logo-icon{width:36px;height:36px;background:linear-gradient(135deg,#0ea5e9,#06b6d4);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;color:white}
.logo-text{font-family:'Orbitron',sans-serif;font-weight:700;font-size:16px;letter-spacing:2px}
.card{background:rgba(15,23,42,0.9);border:1px solid rgba(14,165,233,0.15);border-radius:20px;padding:24px 20px;width:100%;max-width:360px;position:relative;z-index:1}
.title{font-family:'Orbitron',sans-serif;font-size:16px;font-weight:900;letter-spacing:1px;margin-bottom:4px;text-align:center}
.sub{color:#334155;font-size:12px;text-align:center;margin-bottom:24px}
.label{color:#94a3b8;font-size:11px;letter-spacing:0.5px;margin-bottom:6px;display:block}
.input{width:100%;background:rgba(2,8,23,0.8);border:1px solid rgba(14,165,233,0.15);border-radius:10px;padding:12px 14px;color:white;font-size:14px;margin-bottom:14px;outline:none;box-sizing:border-box;font-family:'Inter',sans-serif}
.input::placeholder{color:#334155}
.forgot{color:#0ea5e9;font-size:12px;text-decoration:none;display:block;text-align:right;margin-bottom:20px;margin-top:-8px}
.btn{width:100%;background:linear-gradient(135deg,#0ea5e9,#06b6d4);color:white;padding:14px;border-radius:10px;font-family:'Orbitron',sans-serif;font-size:12px;font-weight:700;letter-spacing:1px;border:none;cursor:pointer;margin-bottom:16px}
.divider{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.divider-line{flex:1;height:1px;background:rgba(14,165,233,0.08)}
.divider-text{color:#334155;font-size:11px}
.msg{border-radius:8px;padding:10px;margin-bottom:14px;font-size:12px;text-align:center;display:none}
.error{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.2);color:#f87171}
.success{background:rgba(34,197,94,0.1);border:1px solid rgba(34,197,94,0.2);color:#4ade80}
.signup-text{text-align:center;color:#334155;font-size:12px}
.signup-link{color:#0ea5e9;text-decoration:none;font-weight:600}
.home-link{color:#334155;font-size:12px;text-decoration:none;margin-top:20px;display:block;text-align:center;position:relative;z-index:1}
</style>
</head>
<body>
<div class="glow"></div>
<div class="logo-wrap">
  <div class="logo-icon">D</div>
  <span class="logo-text">DRONEOPS</span>
</div>
<div class="card">
  <div class="title">WELCOME BACK</div>
  <div class="sub">Sign in to your DroneOps account</div>
  <div class="msg error" id="error"></div>
  <div class="msg success" id="success"></div>
  <label class="label">EMAIL ADDRESS</label>
  <input class="input" type="email" id="email" placeholder="operator@droneops.io">
  <label class="label">PASSWORD</label>
  <input class="input" type="password" id="password" placeholder="••••••••">
  <a href="/forgot-password" class="forgot">Forgot password?</a>
  <button class="btn" id="loginBtn" onclick="handleLogin()">SIGN IN</button>
  <div class="divider">
    <div class="divider-line"></div>
    <span class="divider-text">OR</span>
    <div class="divider-line"></div>
  </div>
  <div class="signup-text">
    Don't have an account?
    <a href="/signup" class="signup-link">Create account</a>
  </div>
</div>
<a href="/" class="home-link">← Back to Home</a>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'
const supabase = createClient(
  'https://hgmtppatmmxzpyeooyux.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhnbXRwcGF0bW14enB5ZW9veXV4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0Mjk2OTcsImV4cCI6MjA5NjAwNTY5N30.IsVw4QCXCZP_uT_qnbJ4xM0l2xypmGdNUJxUjato1vQ'
)
function showMsg(type, msg) {
  document.getElementById('error').style.display = 'none'
  document.getElementById('success').style.display = 'none'
  var el = document.getElementById(type)
  el.textContent = msg
  el.style.display = 'block'
}
window.handleLogin = async function() {
  var email = document.getElementById('email').value.trim()
  var password = document.getElementById('password').value
  var btn = document.getElementById('loginBtn')
  if (!email || !password) {
    showMsg('error', 'Please fill in all fields')
    return
  }
  btn.textContent = 'SIGNING IN...'
  btn.disabled = true
  showMsg('success', 'Connecting...')
  try {
    const { data, error } = await supabase.auth.signInWithPassword({
      email: email,
      password: password
    })
    if (error) {
      showMsg('error', error.message)
      btn.textContent = 'SIGN IN'
      btn.disabled = false
      return
    }
    if (data.user) {
      showMsg('success', 'Login successful! Redirecting...')
      setTimeout(() => { window.location.href = '/dashboard' }, 1500)
    }
  } catch(err) {
    showMsg('error', 'Error: ' + err.message)
    btn.textContent = 'SIGN IN'
    btn.disabled = false
  }
}
</script>
</body>
</html>
